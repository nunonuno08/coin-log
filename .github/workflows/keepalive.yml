# Supabase pauses free projects after 7 days without "sufficient" database activity, and the
# ライブ記録 app learned that a ping every 3 days was not enough; this runs 4 times a day.
name: Keep Supabase awake

on:
  schedule:
    - cron: "41 */6 * * *" # every 6 hours
  workflow_dispatch:

permissions:
  actions: write # lets the job reset GitHub's 60-day inactivity timer for scheduled jobs

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS --retry 3 --retry-delay 30 -X POST "https://mnwhuizxfxyrsbqfyrxx.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_b2gZbljKOqfs53VdX9Z9GQ_ayxkmhfU" \
            -H "Content-Type: application/json" -d '{}'
      # GitHub stops scheduled jobs in repositories without activity for 60 days;
      # re-enabling the workflow counts as activity.
      - name: Keep this schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
